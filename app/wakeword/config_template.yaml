# openWakeWord training config — filled programmatically by pipeline.py
# DO NOT edit manually; this file is a template.

augmentation_batch_size: 16
augmentation_rounds: 1
background_paths:
  - "{data_dir}/fma"
background_paths_duplication_rate:
  - 1
batch_n_per_class:
  ACAV100M_sample: 1024
  adversarial_negative: 50
  positive: 50
custom_negative_phrases: []
# Points to the 50k-row truncated validation set to avoid silent OOM at step 7500
false_positive_validation_data_path: "{data_dir}/validation_set_features_small.npy"
feature_data_files:
  ACAV100M_sample: "{data_dir}/features_neg.npy"
layer_size: 32
max_negative_weight: 1500
model_name: "{model_name}"
model_type: dnn
n_samples: 1000
n_samples_val: 500
output_dir: "{output_dir}"
piper_sample_generator_path: "{piper_generator_dir}"
rir_paths:
  - "{data_dir}/mit_rirs"
steps: 10000
target_accuracy: 0.5
target_false_positives_per_hour: 0.2
target_phrase:
  - "{target_phrase}"
target_recall: 0.25
tts_batch_size: 50
