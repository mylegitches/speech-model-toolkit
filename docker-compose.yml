# NVIDIA GPU (recommended). Needs the NVIDIA Container Toolkit.
# No GPU? Use: docker compose -f docker-compose.cpu.yml up --build
services:
  toolkit:
    build: .
    image: speech-model-toolkit
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
      # Your media library, read only (:ro): the app can never change or delete these files.
      # Set the paths in .env next to this file, e.g. MEDIA_TV=/mnt/media/TV
      - ${MEDIA_TV:-./data/no-media-tv}:/media/tv:ro
      - ${MEDIA_MOVIES:-./data/no-media-movies}:/media/movies:ro
    environment:
      - LOG_LEVEL=INFO  # DEBUG for every request, WARNING for problems only
    extra_hosts:
      # Lets the AI settings reach Ollama / LM Studio running on this machine
      - "host.docker.internal:host-gateway"
    shm_size: 4gb  # PyTorch data loaders need more than Docker's 64 MB default
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
